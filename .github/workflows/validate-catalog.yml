name: Validate catalog

on:
  push:
    paths:
      - "catalog.json"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "catalog.json"
      - "tools/**"
      - "package.json"
      - "package-lock.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
